<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InspoJournal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="main.js" defer></script>
</head>
<body>
    <img id="profileButton" src="assets/default_pfp.png">

    <h1>Inspo Journal</h1>


    <div class="quote">Entry #1 - The start - Aug 18 2025</div>
    <div class="quote">Entry #100 - Still the beginning - Jun 7 2026</div>

    <div id="addQuoteButton">Add Quote</div>

    <div id="popup" class="popup hidden">
        <div class="popupContent">
            <h2>New Quote</h2>

            <div contenteditable="true" id="addMessage"></div>
            
            <div class="buttonRow">
                <div class=button onclick="submitText()">Submit</div>
                <div class=button onclick="closePopup()">Cancel</div>
            </div>
        </div>
    </div>

    <div id="editPopup" class="popup hidden">
        <div class="popupContent">
            <h2>Edit Quote</h2>
    
            <div contenteditable="true" id="editQuoteText"></div>
    
            <div class="buttonRow">
                <div class="button" onclick="saveEditedQuote()">Save</div>
                <div class="button" onclick="closeEditPopup()">Cancel</div>
            </div>
        </div>
    </div>

    <div id="pond">
        <img src="assets/pond.png" id="pondImg">
    </div>

    <a href="writing.html">
        <img src="assets/pagoda.png" alt="Pagoda" id="pagoda">
    </a>

    <div id="spotify">
        <button id="spotifyToggle">></button>
    
        <div id="spotifyContent">
            <div id="spotifyControls">
                <input
                    id="spotifyLink"
                    placeholder="Paste Spotify playlist link">
    
                <button onclick="saveSpotifyLink()">Save</button>
            </div>
    
            <iframe
                id="spotifyPlayer"
                src="https://open.spotify.com/embed/playlist/7JJlE7NPySKvm7FByDhbp7?utm_source=generator"
                frameborder="0"
                allowfullscreen=""
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy">
            </iframe>
        </div>
    </div>

    <div id="netHolder">
        <img src="assets/net.png" id="net">
    </div>

    <div id="authPopup" class="popup hidden">
        <div class="popupContent">
    
            <h2>Account</h2>
    
            <input id="username" placeholder="Username or Email">
    
            <input
                id="password"
                type="password"
                placeholder="Password">
    
            <div class="buttonRow">
                <div class="button" onclick="login()">Login</div>
                <div class="button" onclick="signup()">Sign Up</div>
                <div class="button" onclick="closeAuthPopup()">Close</div>
            </div>
    
        </div>
    </div>

    <div id="profilePopup" class="popup hidden">
        <div class="popupContent">
    
            <h2>Profile</h2>
    
            <img id="profilePreview" src="assets/default_pfp.png">

            <input id="profilePicture" type="file" accept="image/*">

            <div class="usernameRow">
                <div id="profileUsername"></div>
            
                <input id="newUsername" class="hidden">
            
                <img id="usernameButton" src="assets/edit.png" onclick="editUsername()">
            </div>

            <div id="profileEmail" class="profileEmail"></div>
    
            <div class="buttonRow">
                <div class="button" onclick="saveProfile()">Save</div>
                <div class="button" onclick="logout()">Logout</div>
                <div class="button" onclick="closeProfilePopup()">Close</div>
            </div>
    
        </div>
    </div>
    
    <!--
    - Why give something up when you can just work harder?
    - If it gets tough, then just work harder. Everyone wants you to succeed. Everyone
    - Slow down and enjoy life
    -->

</body>
</html>
